<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="sticky top-0 bg-white bg-opacity-90 backdrop-blur-md shadow-sm z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-4 py-3">
      <a href="index.html#home" class="font-semibold text-lg flex items-center gap-2">
        <img src="photos/favicon.jpg" alt="logo" class="rounded-3xl h-9 object-contain">
        ivy ching li
      </a>
      <nav class="text-sm">
        <a href="index.html" class="hover:underline text-gray-600">back to home</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-8 py-16 animate-fade-in">
    <div class="mb-12">
      <h1 class="text-4xl font-bold mb-4">social media portfolio</h1>
      <p class="text-lg text-gray-600">from my work in high school circa 2016 to 2026 postgrad </p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div class="group">
        <div class="aspect-video bg-gray-200 rounded-2xl mb-4 overflow-hidden border card-hover">
           <div class="w-full h-full flex items-center justify-center text-gray-400">brand content placeholder</div>
        </div>
        <h3 class="font-semibold text-lg">featured campaign</h3>
        <p class="text-sm text-gray-500">short form video strategy and execution</p>
      </div>
    </div>
  </main>

  <footer class="border-t py-6 text-center text-sm text-gray-500">
    © <span id="year"></span> Ivy Ching Li. all rights reserved.
  </footer>
  
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
